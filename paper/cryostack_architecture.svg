<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc" font-family="Verdana">
  <title id="title">CryoStack layered platform architecture</title>
  <desc id="desc">A browser connects to the CryoStack gateway, which provides shared services to CryoLauncher, ICESEE, and LIVIST. Modeling applications connect to local, remote HPC, and cloud backends supported by Spack and container environments.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #153445; }
      .layer { font-size: 15px; font-weight: 700; fill: #36576a; letter-spacing: 1px; }
      .box-title { font-size: 21px; font-weight: 700; fill: #153445; }
      .body { font-size: 16px; fill: #36576a; }
      .small { font-size: 14px; fill: #36576a; }
      .arrow { stroke: #54768a; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke: #7394a6; stroke-width: 2.5; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrowhead); }
      .bus { stroke: #54768a; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#54768a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#153445" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="740" rx="18" fill="#f7fafb"/>
  <text x="600" y="48" text-anchor="middle" class="title">CryoStack Scientific Platform</text>

  <text x="20" y="105" class="layer">ACCESS</text>
  <rect x="180" y="72" width="840" height="72" rx="14" fill="#e5f2f5" stroke="#72a9b9" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="103" text-anchor="middle" class="box-title">Web browser</text>
  <text x="600" y="127" text-anchor="middle" class="body">One entry point for documentation, applications, and experiment workspaces</text>

  <path d="M600 144 L600 174" class="arrow"/>

  <text x="20" y="224" class="layer">GATEWAY</text>
  <rect x="180" y="174" width="840" height="108" rx="14" fill="#d7edf0" stroke="#478a9c" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="207" text-anchor="middle" class="box-title">Nginx routing layer</text>
  <text x="600" y="235" text-anchor="middle" class="body">aiohttp application gateway · FastAPI connector relay · HTTP/WebSocket proxying</text>
  <text x="600" y="260" text-anchor="middle" class="body">authentication · saved configurations · experiment records · documentation</text>

  <path d="M360 282 L286 330" class="arrow"/>
  <path d="M600 282 L600 330" class="arrow"/>
  <path d="M840 282 L914 330" class="arrow"/>

  <text x="20" y="386" class="layer">APPLICATIONS</text>
  <rect x="160" y="330" width="270" height="128" rx="14" fill="#fff4da" stroke="#d6a33c" stroke-width="2" filter="url(#shadow)"/>
  <text x="295" y="366" text-anchor="middle" class="box-title">CryoLauncher</text>
  <text x="295" y="396" text-anchor="middle" class="body">Model configuration</text>
  <text x="295" y="420" text-anchor="middle" class="body">and execution</text>
  <text x="295" y="444" text-anchor="middle" class="small">ISSM · Icepack · flowline · L96</text>

  <rect x="465" y="330" width="270" height="128" rx="14" fill="#e2f1e7" stroke="#57916c" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="366" text-anchor="middle" class="box-title">ICESEE</text>
  <text x="600" y="396" text-anchor="middle" class="body">Ensemble state and</text>
  <text x="600" y="420" text-anchor="middle" class="body">parameter estimation</text>
  <text x="600" y="444" text-anchor="middle" class="small">Filter variants · MPI ensembles</text>

  <rect x="770" y="330" width="270" height="128" rx="14" fill="#e8e6f5" stroke="#7770a9" stroke-width="2" filter="url(#shadow)"/>
  <text x="905" y="366" text-anchor="middle" class="box-title">LIVIST</text>
  <text x="905" y="396" text-anchor="middle" class="body">Englacial-temperature</text>
  <text x="905" y="420" text-anchor="middle" class="body">data exploration</text>
  <text x="905" y="444" text-anchor="middle" class="small">Radar · boreholes · geospatial data</text>

  <path d="M295 458 L295 490 L905 490" class="bus"/>
  <path d="M600 458 L600 490" class="bus"/>
  <path d="M295 490 L295 520" class="arrow"/>
  <path d="M600 490 L600 520" class="arrow"/>
  <path d="M905 490 L905 520" class="arrow"/>

  <text x="20" y="578" class="layer">EXECUTION</text>
  <rect x="160" y="520" width="270" height="106" rx="14" fill="#edf3f5" stroke="#7896a5" stroke-width="2" filter="url(#shadow)"/>
  <text x="295" y="558" text-anchor="middle" class="box-title">Local</text>
  <text x="295" y="588" text-anchor="middle" class="body">Python · notebooks · MPI</text>
  <text x="295" y="612" text-anchor="middle" class="small">Interactive and small workflows</text>

  <rect x="465" y="520" width="270" height="106" rx="14" fill="#edf3f5" stroke="#7896a5" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="558" text-anchor="middle" class="box-title">Remote HPC</text>
  <text x="600" y="588" text-anchor="middle" class="body">Connector · SSH · Slurm</text>
  <text x="600" y="612" text-anchor="middle" class="small">Job staging, logs, and outputs</text>

  <rect x="770" y="520" width="270" height="106" rx="14" fill="#edf3f5" stroke="#7896a5" stroke-width="2" filter="url(#shadow)"/>
  <text x="905" y="558" text-anchor="middle" class="box-title">Cloud</text>
  <text x="905" y="588" text-anchor="middle" class="body">VMs · managed Slurm</text>
  <text x="905" y="612" text-anchor="middle" class="small">Configured elastic resources</text>

  <path d="M295 626 L295 665" class="arrow"/>
  <path d="M600 626 L600 665" class="arrow"/>
  <path d="M905 626 L905 665" class="arrow"/>

  <text x="20" y="700" class="layer">ENVIRONMENTS</text>
  <rect x="160" y="665" width="880" height="54" rx="14" fill="#dce9ee" stroke="#5d8293" stroke-width="2"/>
  <text x="600" y="699" text-anchor="middle" class="box-title">Spack environments · Docker and Apptainer containers</text>
</svg>
